name: Compile v1.0.37 macOS browser annotations
on:
  push:
    branches: [codex/verify-macos-annotations-v1.0.37]
permissions:
  contents: read
jobs:
  apple-sdk:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile changed Objective-C++ sources for both release architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/include/nlohmann"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/include/nlohmann/json.hpp" https://github.com/nlohmann/json/releases/download/v3.12.0/json.hpp
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/include/nlohmann/json_fwd.hpp" https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json_fwd.hpp
          for arch in arm64 x86_64; do
            for src in src/apps/desktop/{agent_browser_capture_mac,agent_browser_host_mac,agent_browser_macos_helpers}.mm; do
              echo "Compiling $src for $arch"
              xcrun clang++ -arch "$arch" -std=c++17 -fblocks -c "$src" -I"$RUNNER_TEMP/include" -Isrc/base -Isrc/domain -Isrc/adapters -Isrc/engine -Isrc/host -Isrc/apps -o "$RUNNER_TEMP/$(basename "$src").$arch.o"
            done
          done
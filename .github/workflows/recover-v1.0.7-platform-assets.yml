name: Recover v1.0.7 Deepin ARMv7 asset
'on':
  push:
    branches:
    - claude/recover-v1.0.7-platform-assets
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-v1.0.7-deepin-armv7
  cancel-in-progress: false
jobs:
  build-web-ui:
    name: web-dist
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: v1.0.7
    - name: Verify immutable v1.0.7 source
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        test "$(git rev-parse HEAD)" = "bb779f1f81e55536e56d21c3e5d66be1b2c1158e"
        git diff --exit-code
    - name: Check bundled models.dev freshness for release
      if: 'true'
      shell: bash
      run: |
        python3 - <<'PY'
        import datetime as dt
        import json
        from pathlib import Path

        manifest_path = Path("assets/models_dev/MANIFEST.json")
        try:
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
            generated_at = dt.datetime.fromisoformat(
                manifest["generated_at"].replace("Z", "+00:00")
            )
        except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
            raise SystemExit(f"Invalid {manifest_path}: {exc}")

        if generated_at.tzinfo is None:
            raise SystemExit(f"{manifest_path}: generated_at must include a timezone")
        now = dt.datetime.now(dt.timezone.utc)
        age = now - generated_at.astimezone(dt.timezone.utc)
        if age < -dt.timedelta(minutes=5):
            raise SystemExit(f"{manifest_path}: generated_at is in the future")
        if age > dt.timedelta(days=30):
            raise SystemExit(
                f"Bundled models.dev registry is {age.days} days old; "
                "run scripts/sync_models_dev before creating a release tag"
            )
        print(f"Bundled models.dev registry age: {age.days} days")
        PY
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.32.1
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Build web UI
      shell: bash
      run: |
        cd web
        pnpm install --frozen-lockfile
        pnpm build
    - name: Upload web UI
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: web/dist
        if-no-files-found: error
    timeout-minutes: 60
    env:
      ACE_RECOVERY_REF: refs/tags/v1.0.7
      ACE_RECOVERY_REF_NAME: v1.0.7
  build-linux-deepin-package:
    name: ${{ matrix.id }}
    needs: build-web-ui
    runs-on: ${{ matrix.os }}
    container:
      image: buildpack-deps:buster
    env:
      DEBIAN_FRONTEND: noninteractive
      VCPKG_BINARY_SOURCES: clear;default,readwrite
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      ACE_RECOVERY_REF: refs/tags/v1.0.7
      ACE_RECOVERY_REF_NAME: v1.0.7
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: linux-deepin-armv7
          os: ubuntu-22.04
          triplet: arm-linux
          executable: acecode
          archive_extension: tar.gz
          build_desktop: false
          cmake_extra_args: -DACECODE_BUILD_DESKTOP=OFF -DACECODE_DEEPIN=ON -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/toolchains/linux.cmake"
            -DVCPKG_TARGET_ARCHITECTURE=arm -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DCMAKE_C_COMPILER_TARGET=arm-linux-gnueabihf
            -DCMAKE_CXX_COMPILER_TARGET=arm-linux-gnueabihf -DCMAKE_C_STANDARD_INCLUDE_DIRECTORIES=/usr/arm-linux-gnueabihf/include
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES="/usr/arm-linux-gnueabihf/include/c++/8;/usr/arm-linux-gnueabihf/include/c++/8/arm-linux-gnueabihf;/usr/arm-linux-gnueabihf/include"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: v1.0.7
    - name: Verify immutable v1.0.7 source
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        test "$(git rev-parse HEAD)" = "bb779f1f81e55536e56d21c3e5d66be1b2c1158e"
        git diff --exit-code
    - name: Install Deepin build dependencies
      shell: bash
      run: |
        printf 'Acquire::Retries "3";\nAcquire::https::No-Cache "true";\nAcquire::http::No-Cache "true";\n' > /etc/apt/apt.conf.d/99-ace-network-retry
        sed -i \
          -e 's|http://deb.debian.org/debian|https://archive.debian.org/debian|g' \
          -e 's|http://security.debian.org/debian-security|https://archive.debian.org/debian-security|g' \
          -e 's|http://deb.debian.org/debian-security|https://archive.debian.org/debian-security|g' \
          /etc/apt/sources.list
        printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
        apt-get update
        packages=(
          binutils \
          build-essential \
          ca-certificates \
          curl \
          file \
          git \
          ninja-build \
          perl \
          pkg-config \
          python3 \
          python3-pip \
          tar \
          unzip \
          zip
        )
        if [ "${{ matrix.build_desktop }}" = "true" ]; then
          packages+=(
            libgtk-3-dev libwebkit2gtk-4.0-dev libx11-dev
            qtbase5-dev qtbase5-private-dev qttools5-dev-tools qtmultimedia5-dev
            libqt5x11extras5-dev libqt5svg5-dev libgsettings-qt-dev
            libstartup-notification0-dev libxcb-util0-dev libmtdev-dev
            libegl1-mesa-dev libudev-dev libxi-dev libcups2-dev librsvg2-dev
          )
        fi
        if [ "${{ matrix.id }}" = "linux-deepin-armv7" ]; then
          packages+=(
            binutils-arm-linux-gnueabihf
            clang-11
            gcc-arm-linux-gnueabihf
            g++-arm-linux-gnueabihf
            qemu-user
          )
        fi
        # The archive CDN keeps returning cached 404s for files that exist (libclang-cpp11 for the
        # previous release, clang-11 now). Fetch every package APT selected over HTTPS with a
        # cache-busting query and verify it against the signed index hash before APT installs it.
        apt-get install -y --no-install-recommends --print-uris "${packages[@]}" | grep "^'" > /tmp/ace-uris || true
        while read -r ace_url ace_file ace_size ace_hash; do
          ace_url="${ace_url//\'/}"; ace_url="${ace_url/#http:/https:}"
          ace_out="/var/cache/apt/archives/$ace_file"
          case "$ace_hash" in SHA256:*) ace_sum=sha256sum ;; MD5Sum:*) ace_sum=md5sum ;; *) echo "unknown hash $ace_hash"; exit 100 ;; esac
          # Runner-region CDN nodes can keep a stale 404 even with a fresh query string; the same
          # file then comes from snapshot.debian.org (buster as of its last LTS month).
          case "$ace_url" in
            */debian-security/*) ace_snapshot="https://snapshot.debian.org/archive/debian-security/20240620T000000Z/${ace_url#*/debian-security/}" ;;
            *) ace_snapshot="https://snapshot.debian.org/archive/debian/20240620T000000Z/${ace_url#*/debian/}" ;;
          esac
          ace_ok=0
          for ace_source in "$ace_url?acecode-recovery=$GITHUB_RUN_ID" "$ace_snapshot" "$ace_snapshot"; do
            if curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
                 "$ace_source" --output "$ace_out.part" &&
               printf '%s  %s\n' "${ace_hash#*:}" "$ace_out.part" | "$ace_sum" --check --quiet -; then
              mv "$ace_out.part" "$ace_out"; ace_ok=1; break
            fi
            rm -f "$ace_out.part"
            sleep 5
          done
          if [ "$ace_ok" != "1" ]; then echo "could not fetch $ace_url"; exit 100; fi
        done < /tmp/ace-uris
        for ace_attempt in 1 2 3; do
          if apt-get install -y --no-install-recommends "${packages[@]}"; then break; fi
          if [ "$ace_attempt" = "3" ]; then exit 100; fi
          echo "Archive dependency download failed; retry $ace_attempt/3 in 15 seconds"
          sleep 15
          apt-get update
        done
        rm -rf /var/lib/apt/lists/*
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 3.29.x
    - name: Build pinned DTK 5 SDK
      if: matrix.build_desktop
      shell: bash
      run: |
        sdk_prefix="$RUNNER_TEMP/acecode-dtk-sdk"
        bash scripts/build_deepin_dtk_sdk.sh "$sdk_prefix" "$RUNNER_TEMP/acecode-dtk-build"
        printf 'CMAKE_PREFIX_PATH=%s\n' "$sdk_prefix" >> "$GITHUB_ENV"
        printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\n' "$sdk_prefix" >> "$GITHUB_ENV"
        printf 'LD_LIBRARY_PATH=%s/lib\n' "$sdk_prefix" >> "$GITHUB_ENV"
    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-v3-deepin-buster-${{ matrix.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json',
          'ports/**') }}
        restore-keys: |
          vcpkg-v3-deepin-buster-${{ matrix.os }}-${{ matrix.triplet }}-
    - name: Download web UI
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: web/dist
    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
          -DBUILD_TESTING=OFF \
          -DCMAKE_SKIP_BUILD_RPATH=ON \
          ${{ matrix.cmake_extra_args }}
    - name: Build
      shell: bash
      run: cmake --build build --config MinSizeRel --target acecode
    - name: Build desktop
      if: matrix.build_desktop
      shell: bash
      run: cmake --build build --config MinSizeRel --target acecode-desktop
    - name: Verify Deepin ABI
      shell: bash
      run: |
        abi_binaries=(build/acecode)
        if [ "${{ matrix.build_desktop }}" = "true" ]; then
          abi_binaries+=(build/acecode-desktop)
        fi
        max_glibc="$(
          strings "${abi_binaries[@]}" |
            grep -Eo 'GLIBC_[0-9]+\.[0-9]+' |
            sed 's/GLIBC_//' |
            sort -Vu |
            tail -n1
        )"
        if [ -z "$max_glibc" ]; then
          echo "No GLIBC symbol versions found" >&2
          exit 1
        fi
        echo "Max GLIBC symbol: GLIBC_$max_glibc"
        if [ "$(printf '%s\n%s\n' "$max_glibc" "2.28" | sort -V | tail -n1)" != "2.28" ]; then
          echo "Deepin package requires GLIBC_$max_glibc, expected <= GLIBC_2.28" >&2
          exit 1
        fi

        if [ "${{ matrix.build_desktop }}" = "true" ]; then
          ldd build/acecode-desktop | tee build/acecode-desktop.ldd
          grep -E 'libwebkit2gtk-4\.0\.so\.37' build/acecode-desktop.ldd
          grep -E 'libdtkwidget\.so\.5' build/acecode-desktop.ldd
          grep -E 'libdtkgui\.so\.5' build/acecode-desktop.ldd
          if grep -F 'not found' build/acecode-desktop.ldd; then
            echo "Deepin desktop has unresolved runtime dependencies" >&2
            exit 1
          fi
          if grep -E 'libwebkit2gtk-4\.1|libwebkitgtk-6' build/acecode-desktop.ldd; then
            echo "Deepin desktop linked against a newer WebKitGTK ABI" >&2
            exit 1
          fi
        fi
    - name: Verify Deepin ARMv7 executable
      if: matrix.id == 'linux-deepin-armv7'
      shell: bash
      run: |
        export LC_ALL=C
        elf_header="$(arm-linux-gnueabihf-readelf -h build/acecode)"
        arm_attributes="$(arm-linux-gnueabihf-readelf -A build/acecode)"
        program_headers="$(arm-linux-gnueabihf-readelf -l build/acecode)"

        printf '%s\n' "$elf_header"
        printf '%s\n' "$arm_attributes"

        grep -Eq 'Class:[[:space:]]+ELF32' <<<"$elf_header"
        grep -Eq 'Machine:[[:space:]]+ARM' <<<"$elf_header"
        grep -Eq 'Tag_CPU_arch:[[:space:]]+v7' <<<"$arm_attributes"
        grep -Eq 'Tag_ABI_VFP_args:[[:space:]]+VFP registers' <<<"$arm_attributes"
        grep -Fq '/lib/ld-linux-armhf.so.3' <<<"$program_headers"

        version_output="$(qemu-arm -L /usr/arm-linux-gnueabihf build/acecode --version)"
        printf '%s\n' "$version_output"
        grep -Eq '^acecode v[^[:space:]]+$' <<<"$version_output"
    - name: Extract debug symbols
      shell: bash
      run: |
        binutils_prefix=""
        if [ "${{ matrix.id }}" = "linux-deepin-armv7" ]; then
          binutils_prefix="arm-linux-gnueabihf-"
        fi
        "${binutils_prefix}objcopy" --only-keep-debug \
          "build/${{ matrix.executable }}" \
          "build/${{ matrix.executable }}.debug"
        "${binutils_prefix}strip" --strip-unneeded "build/${{ matrix.executable }}"
        "${binutils_prefix}objcopy" \
          --add-gnu-debuglink="build/${{ matrix.executable }}.debug" \
          "build/${{ matrix.executable }}"

        if [ "${{ matrix.build_desktop }}" = "true" ]; then
          objcopy --only-keep-debug "build/acecode-desktop" "build/acecode-desktop.debug"
          strip --strip-unneeded "build/acecode-desktop"
          objcopy --add-gnu-debuglink="build/acecode-desktop.debug" "build/acecode-desktop"
        fi
    - name: Package
      shell: bash
      run: |
        package_dir="dist/acecode-${{ matrix.id }}"
        mkdir -p "$package_dir"

        validate_models_dev_registry() {
          registry_dir="$1"
          file_count="$(find "$registry_dir" -type f | wc -l | tr -d '[:space:]')"
          if [ "$file_count" != "3" ]; then
            echo "Expected exactly 3 models.dev files in $registry_dir, found $file_count" >&2
            exit 1
          fi
          for file in api.json MANIFEST.json LICENSE; do
            if [ ! -f "$registry_dir/$file" ] ||
               ! cmp -s "assets/models_dev/$file" "$registry_dir/$file"; then
              echo "Missing or mismatched models.dev package file: $registry_dir/$file" >&2
              exit 1
            fi
          done
        }

        if [ ! -f "build/${{ matrix.executable }}" ]; then
          echo "Missing terminal executable: build/${{ matrix.executable }}" >&2
          exit 1
        fi
        cp "build/${{ matrix.executable }}" "$package_dir/"
        cp README.md README_CN.md "$package_dir/"
        cp docs/deepin-desktop.md "$package_dir/DEEPIN.md"
        cmake --install build \
          --config MinSizeRel \
          --prefix "$PWD/$package_dir" \
          --component models_dev_registry
        cmake --install build \
          --config MinSizeRel \
          --prefix "$PWD/$package_dir" \
          --component default_seed_bundle
        cmake --install build --config MinSizeRel --prefix "$PWD/$package_dir" --component whatsapp_channel
        validate_models_dev_registry "$package_dir/share/acecode/models_dev"
        python3 scripts/verify_seed_bundle.py \
          --source assets/seed \
          --packaged "$package_dir/share/acecode/seed"

        if [ "${{ matrix.build_desktop }}" = "true" ]; then
          if [ ! -f "build/acecode-desktop" ]; then
            echo "Missing desktop executable: build/acecode-desktop" >&2
            exit 1
          fi
          cp "build/acecode-desktop" "$package_dir/"
          cp "build/acecode-logo.png" "$package_dir/"
        fi

        legacy="$(find "$package_dir" -maxdepth 1 -iname 'ace-browser-*' -print -quit)"
        if [ -n "$legacy" ]; then
          echo "Legacy browser artifact must not be packaged: $legacy" >&2
          exit 1
        fi
        python3 scripts/verify_deepin_package.py "$package_dir"
        tar -C dist -czf "acecode-${{ matrix.id }}.tar.gz" "acecode-${{ matrix.id }}"

        verify_root="$(mktemp -d)"
        tar -xzf "acecode-${{ matrix.id }}.tar.gz" -C "$verify_root"
        python3 scripts/verify_deepin_package.py "$verify_root/acecode-${{ matrix.id }}"
        validate_models_dev_registry \
          "$verify_root/acecode-${{ matrix.id }}/share/acecode/models_dev"
        python3 scripts/verify_seed_bundle.py \
          --source assets/seed \
          --packaged "$verify_root/acecode-${{ matrix.id }}/share/acecode/seed"
        rm -rf -- "$verify_root"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: acecode-${{ matrix.id }}
        path: acecode-${{ matrix.id }}.${{ matrix.archive_extension }}
        if-no-files-found: error
    - name: Upload debug symbols
      uses: actions/upload-artifact@v4
      with:
        name: acecode-${{ matrix.id }}-debug
        path: build/${{ matrix.executable }}.debug
        if-no-files-found: warn
    - name: Upload desktop debug symbols
      if: matrix.build_desktop
      uses: actions/upload-artifact@v4
      with:
        name: acecode-${{ matrix.id }}-desktop-debug
        path: build/acecode-desktop.debug
        if-no-files-found: warn
    timeout-minutes: 60

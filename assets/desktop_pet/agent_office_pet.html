:root{--k:1.25;--font:"Pixelify Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font:12px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
.scene{position:relative;width:100vw;height:100vh}
.scene canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.ov{position:absolute;inset:0;pointer-events:none;line-height:1.4}
.scene canvas.up{position:absolute;inset:0;image-rendering:auto;pointer-events:none}
.grip{position:absolute;left:calc(11 / 344 * 100%);top:calc(112 / 252 * 100%);width:16px;height:16px;cursor:nwse-resize;opacity:0;transition:opacity .15s;z-index:3}
.scene:hover .grip{opacity:.95}
.grip svg{display:block;width:100%;height:100%}
.zoom-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#27324f;color:#fff;font-weight:700;border-radius:6px;padding:2px 9px;font-size:13px;pointer-events:none;z-index:4}
.bub{position:absolute;left:0;top:0;z-index:2;display:flex;align-items:center;gap:3px;max-width:min(64vw,calc(var(--k) * 150px));background:#fff;color:#1b2540;border:2px solid #27324f;border-radius:6px;padding:1px 6px 2px;font-size:max(10px,calc(var(--k) * 6.2px));font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 rgba(20,24,40,.28)}
.bub::after{content:"";position:absolute;left:var(--tail,50%);bottom:-6px;width:8px;height:8px;margin-left:-4px;background:inherit;border-right:2px solid #27324f;border-bottom:2px solid #27324f;transform:rotate(45deg)}
.bub::before{content:"";position:absolute;left:var(--tail,50%);top:100%;width:2px;margin-left:-1px;height:var(--lead,0px);background:#27324f;opacity:.55}
.bub.bot{background:#e6f4ff;transform:translate(-50%,calc(-100% - 7px))}
.bub[hidden],.bub-detail[hidden]{display:none}
.bub-label{flex:0 0 auto;max-width:calc(var(--k) * 96px);overflow:hidden;text-overflow:ellipsis}
.bub-detail{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font:500 1em/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#4d5875}
.bub.compact .bub-detail{display:none}
.bub.think{background:#f3f0ff}
.bub.think .bub-detail{font-style:italic}
.bub.type{background:#f2fbf4}
.bub.type .bub-detail{color:#22324f}
.bub.type .bub-detail::after{content:"\258d";margin-left:1px;color:#2f8f57;animation:office-caret 1s steps(1) infinite}
.bub.wait{background:#eef4fb}
.bub.alert{background:#fff1bf}
.bub.bad{background:#ffe2dc}
.bub.flash{background:#e6f7e9}
.bub.picked{outline:2px solid #ffe14d;outline-offset:1px}
@keyframes office-caret{50%{opacity:0}}
.tag{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:#ffe27a;color:#3a2a00;border:2px solid #27324f;border-radius:3px;font-size:max(10px,calc(var(--k) * 6px));font-weight:700;padding:0 4px;white-space:nowrap;z-index:3}

:root{--office-paper:#fff9e9;--office-ink:#27324f;--office-line:#a8a6a4;--office-selected:#dce7f6}
.office-controls{position:absolute;z-index:5;top:calc(var(--k)*2px);left:calc(var(--k)*4px);right:calc(var(--k)*4px);height:calc(var(--k)*26px);display:flex;align-items:center;gap:4px;font:12px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:var(--office-ink)}
.office-controls{opacity:0;pointer-events:none}
.office-controls.is-visible{opacity:1;pointer-events:auto}
.office-tabs{display:flex;gap:3px;flex:1;min-width:0}
.office-tab,.office-follow,.office-overflow,.office-window-button{font:inherit;color:inherit;background:var(--office-paper);border:1px solid var(--office-line);border-radius:4px;cursor:pointer;min-width:0;padding:5px 7px;line-height:1.3}
.office-tab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.office-tab[aria-selected="true"]{background:var(--office-selected);border-color:#526a91}
.office-tab:hover,.office-follow:hover,.office-overflow:hover,.office-window-button:hover{background:#e6ecf5}
.office-tab:focus-visible,.office-follow:focus-visible,.office-overflow:focus-visible,.office-window-button:focus-visible{outline:2px solid #4378be;outline-offset:1px}
.office-window-button{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;padding:4px}
.office-window-button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.office-pin[aria-pressed="true"]{background:var(--office-selected);border-color:#526a91}
.office-pin[aria-pressed="false"] svg{transform:rotate(45deg)}
.office-follow{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap}
.office-follow::before{content:"";display:block;width:8px;height:8px;border:1px solid #65738b;border-radius:2px}
.office-follow[aria-checked="true"]::before{background:#456b9c;border-color:#456b9c}
.office-notice{position:absolute;left:50%;top:calc(var(--k)*30px);transform:translateX(-50%);max-width:90%;font:11px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:var(--office-ink);background:var(--office-paper);padding:2px 6px;border-radius:3px;z-index:4}

.office-tool[hidden]{display:none}
.office-overflow{position:absolute;right:calc(var(--k)*13px);bottom:calc(var(--k)*14px);z-index:4}
.office-members{position:absolute;z-index:6;top:calc(var(--k)*30px);left:8px;right:8px;max-height:65%;overflow:auto;background:var(--office-paper);border:1px solid var(--office-line);border-radius:5px;padding:6px;scrollbar-color:#a8b6c9 var(--office-paper);scrollbar-width:thin}
.office-members button{display:block;width:100%;background:transparent;border:0;color:var(--office-ink);text-align:left;padding:6px;cursor:pointer;font:12px/1.4 "Segoe UI",sans-serif}
.office-members button:hover{background:var(--office-selected)}
@media(max-width:400px){.office-controls{font-size:11px;gap:2px}.office-tab,.office-follow{padding:2px 3px}.office-tabs{gap:2px}.office-follow{gap:2px}.office-follow::before{width:6px;height:6px}}

<body>
<div class="scene" id="scene">
  <div class="office-controls" id="officeControls" aria-label="办公室控制">
    <div class="office-tabs" id="officeTabs" role="tablist" aria-label="最近发消息的五个会话"></div>
    <button class="office-follow" id="officeFollow" type="button" role="switch" aria-checked="true" title="跟随主窗口当前会话">跟随</button>
    <button class="office-window-button office-pin" id="officePin" type="button" aria-pressed="true" aria-label="置顶办公室" title="取消置顶">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V3H8v6l-3 4v3h14v-3l-3-4ZM12 16v5"/></svg>
    </button>
    <button class="office-window-button" id="officeClose" type="button" aria-label="关闭办公室" title="关闭办公室">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="office-notice" id="officeNotice" role="status">正在连接会话</div>
  <button class="office-overflow" id="officeOverflow" type="button" hidden></button>
  <div class="office-members" id="officeMembers" hidden></div>
  <canvas id="cv" width="344" height="252" aria-label="像素风 AI 办公室，Agent 们在工位上工作"></canvas>
  <canvas id="up" class="up" hidden></canvas>
  <div class="ov" id="ov"></div>
  <div class="grip" id="grip" title="拖动调整大小，双击恢复默认大小"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7L7 2M2 11L11 2M2 15L15 2" stroke="#2b2737" stroke-width="3.4" stroke-linecap="square" fill="none"/><path d="M2 7L7 2M2 11L11 2M2 15L15 2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="square" fill="none"/></svg></div>
  <div class="zoom-badge" id="zoomBadge" hidden></div>
</div>
<script>
/* AI Agent 像素办公室 —— 纯原生 JS，零依赖，可离线运行
   ACECode 桌面宠物版：只保留场景画布与气泡层；草地不画（窗口在那里透明），
   面板 / 按钮 / 花名册 / 事件日志全部去掉，交互改为拖动挪窗口 + 右键原生菜单。 */
(() => {
'use strict';
/* =====================================================================
   像素 AI 办公室 —— 资源复用思路
   1. 一个图元 box()：所有家具、墙、机器人都是等距长方体拼出来的
   2. 一个基色 → 三个面：mat(c) 自动算顶面/左面/右面明暗，换色只改一个值
   3. 一个像素模板渲染器 pix() + 调色板：小人、图标、数字、信封全靠它
   4. 小人 = 身体模板 × 调色板换色 × 水平翻转 × 动作补丁 × 配饰补丁
   5. 一个描边后处理 outline()：所有精灵共用同一套像素描边
   6. 一个精灵缓存 sprite(key)：同样外观只画一次，场景里无限实例化
   7. 预制体：工位 = 椅子 + 人 + 桌 + 显示器；双人工位 = 工位 ×2（镜像）+ 隔板
   ===================================================================== */

/* ---------- 0. 工具 ---------- */
const T = 8, RW = 88, RD = 72, WALL_H = 40;          // 1 格 = 8 单位，房间 11×9 格
const VIEW = { w: 344, h: 252, ox: 156, oy: 86 };
const INK = '#2b2737';                                // 统一描边色

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = rng(20260927);
const pick = a => a[(R() * a.length) | 0];
const hash = n => { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };

const toRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = toRGB(a), B = toRGB(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const lite = (c, t) => mix(c, '#ffffff', t), dark = (c, t) => mix(c, '#000000', t);
const mat = c => typeof c === 'object' ? c : { top: lite(c, .2), left: c, right: dark(c, .17) };

/* ---------- 1. 等距光栅化：一个图元走天下 ---------- */
const P = (o, x, y, z = 0) => [o.ox + 2 * (x - y), o.oy + x + y - z];

function fillPoly(g, pts, color) {            // 自己扫描线填充，保证 2:1 像素阶梯清晰不糊
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  g.fillStyle = color;
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
    const cy = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= cy && by > cy) || (by <= cy && ay > cy)) xs.push(ax + (cy - ay) * (bx - ax) / (by - ay));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const a = Math.round(xs[k]), b = Math.round(xs[k + 1]);
      if (b > a) g.fillRect(a, y, b - a, 1);
    }
  }
}
function box(g, o, x, y, z, w, d, h, c) {
  const m = mat(c);
  if (h > 0) {
    fillPoly(g, [P(o, x, y + d, z + h), P(o, x + w, y + d, z + h), P(o, x + w, y + d, z), P(o, x, y + d, z)], m.left);
    fillPoly(g, [P(o, x + w, y, z + h), P(o, x + w, y + d, z + h), P(o, x + w, y + d, z), P(o, x + w, y, z)], m.right);
  }
  fillPoly(g, [P(o, x, y, z + h), P(o, x + w, y, z + h), P(o, x + w, y + d, z + h), P(o, x, y + d, z + h)], m.top);
}
const faceX = (g, o, x, y0, y1, z0, z1, c) => fillPoly(g, [P(o, x, y0, z1), P(o, x, y1, z1), P(o, x, y1, z0), P(o, x, y0, z0)], c);
const faceY = (g, o, y, x0, x1, z0, z1, c) => fillPoly(g, [P(o, x0, y, z1), P(o, x1, y, z1), P(o, x1, y, z0), P(o, x0, y, z0)], c);
const faceZ = (g, o, z, x0, y0, x1, y1, c) => fillPoly(g, [P(o, x0, y0, z), P(o, x1, y0, z), P(o, x1, y1, z), P(o, x0, y1, z)], c);
function lineX(g, o, x, y0, y1, z, c) { g.fillStyle = c; for (let y = y0; y < y1; y++) { const [sx, sy] = P(o, x, y, z); g.fillRect(sx - 2, sy, 2, 1); } }
function vline(g, o, x, y, z0, z1, c) { g.fillStyle = c; for (let z = z0; z < z1; z++) { const [sx, sy] = P(o, x, y, z); g.fillRect(sx - 1, sy, 1, 1); } }
function lineY(g, o, y, x0, x1, z, c) { g.fillStyle = c; for (let x = x0; x < x1; x++) { const [sx, sy] = P(o, x, y, z); g.fillRect(sx, sy, 2, 1); } }

/* ---------- 2. 描边 + 像素模板 + 精灵缓存 ---------- */
function outline(cv, col = INK) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const im = g.getImageData(0, 0, W, H), d = im.data, a = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  const [r, gg, b] = toRGB(col);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < W - 1 && a[i + 1]) || (y > 0 && a[i - W]) || (y < H - 1 && a[i + W])) {
      const k = i * 4; d[k] = r; d[k + 1] = gg; d[k + 2] = b; d[k + 3] = 255;
    }
  }
  g.putImageData(im, 0, 0);
}
function pix(rows, pal, flip = false, ol = true) {
  const h = rows.length, w = rows[0].length, m = ol ? 1 : 0;
  const cv = mk(w + 2 * m, h + 2 * m), g = cv.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < w; x++) { const c = pal[row[x]]; if (!c) continue; g.fillStyle = c; g.fillRect((flip ? w - 1 - x : x) + m, y + m, 1, 1); } });
  if (ol) outline(cv, pal.ink || INK);
  return cv;
}
const patch = (rows, ps) => {
  if (!ps) return rows; rows = rows.slice();
  for (const [i, s] of ps) rows[i] = [...rows[i]].map((ch, k) => (s[k] && s[k] !== '_') ? s[k] : ch).join('');
  return rows;
};
const SPR = new Map(); let blits = 0;
const sprite = (key, build) => { let s = SPR.get(key); if (!s) { s = build(); SPR.set(key, s); } return s; };
function isoSprite(key, [x0, y0, x1, y1, h], draw, ol = true) {
  return sprite(key, () => {
    const m = 2, sx0 = 2 * (x0 - y1), sx1 = 2 * (x1 - y0), sy0 = x0 + y0 - h, sy1 = x1 + y1;
    const cv = mk(sx1 - sx0 + 2 * m, sy1 - sy0 + 2 * m), o = { ox: m - sx0, oy: m - sy0 };
    draw(cv.getContext('2d'), o);
    if (ol) outline(cv);
    return { cv, ax: o.ox, ay: o.oy };
  });
}
function blit(c, s, x, y, z = 0) {
  const [sx, sy] = P(VIEW, x, y, z);
  c.drawImage(s.cv, Math.round(sx - s.ax), Math.round(sy - s.ay)); blits++;
}

/* ---------- 3. 小人：1 套模板 × 调色板 × 翻转 × 补丁 ---------- */
const BODY = {
  front: [ // 面朝右下（看得见脸）
    '....hhhhh...',
    '..hhhhhhhhh.',
    '.hhhhhhhllhh',
    '.hhhhhhhhhhh',
    '.hhhhhhshhsh',
    '.hhhhsssssss',
    '.Hhhssessses',
    '.Hhhssessses',
    '..Hhsbssssbs',
    '...HSsssssS.',
    '.....sss....',
    '...cwwwwcc..',
    '..ccccwwcccc',
    '.ccccccccccc',
    '.sCccccccccs',
    '..CCCCCCCC..',
    '..pppppppp..'],
  back: [  // 背对镜头（面朝左上）
    '...hhhhhh...',
    '..hhhhhhhhh.',
    '.hhhhllhhhhh',
    '.hhhhhhhhhhh',
    '.hhhhhhhhhhh',
    '.hhhhhhhhhhh',
    '.hhhhhhhhhhs',
    '.HhhhhhhhhHs',
    '..HHhhhhhHS.',
    '...HHHHHH...',
    '.....sss....',
    '...cccccc...',
    '..cccccccc..',
    '.cccccccccc.',
    '.sCccccccCs.',
    '..CCCCCCCC..',
    '..pppppppp..'],
};
const FRAMES = { // 动作 = 在同一模板上打几行补丁（_ 表示不变）
  front: {
    typeA: [[13, '_s__________'], [14, '_C__________']],
    typeB: [[13, '___________s'], [14, '___________c']],
    blink: [[6, '______s___s_']],
  },
  back: {
    typeA: [[13, '_s__________'], [14, '_c__________']],
    typeB: [[13, '__________s_'], [14, '__________C_']],
  },
};
const ACC = { // 配饰 / 发型也是补丁
  long:    { front: [[8, '.h__________'], [9, '.hh_________'], [10, '.hH_________'], [11, '.hH_________'], [12, '.H__________']],
             back:  [[9, '.hhHHHHHHhh.'], [10, '..hhhhhhhh..'], [11, '..hHhhhhHh..']] },
  tie:     { front: [[12, '______r_____'], [13, '______r_____']] },
  glasses: { front: [[6, '_____g_ggg_g']], back: [[6, '__________g_']] },
  headset: { front: [[1, '__aaaaaaaaa_'], [5, '__aA________'], [6, '__aA________'], [7, '__aA________'], [8, '____a_______'], [9, '____aa______']],
             back:  [[1, '__aaaaaaaaa_'], [5, '_a_________a'], [6, '_a_________a']] },
  cap:     { front: [[0, '....aaaaa...'], [1, '..aaaaaaaaa.'], [2, '.aaaaaaaaaaa'], [3, '________AAAA']],
             back:  [[0, '...aaaaaa...'], [1, '..aaaaaaaaa.'], [2, '.aaaaaaaaaaa'], [3, '.aaaaaaaaaaa']] },

  // ---- 扩充发型（10 种）：只改头发像素，发色跟着 h / H / l 走 ----
  ponytail:  { front: [[2, 'a___________'], [3, 'h___________'], [4, 'h___________'], [5, 'h___________'], [6, 'H___________'], [7, 'h___________'], [8, 'Hh__________'], [9, '.H__________']],
               back:  [[4, '_____aa_____'], [9, '_____hh_____'], [10, '_____hH_____'], [11, '_____hh_____'], [12, '_____H______']] },
  twintails: { front: [[2, 'a___________'], [3, 'h___________'], [4, 'h___________'], [5, 'h___________'], [6, 'H___________'], [7, 'h___________'], [8, 'Hh__________'], [9, '.H_________a'], [10, '___________h'], [11, '__________hH']],
               back:  [[3, 'a__________a'], [4, 'h___________'], [5, 'h___________'], [6, 'H___________'], [7, 'h___________'], [8, 'h__________h'], [9, 'H_________hh'], [10, '_h________hH'], [11, '_H__________']] },
  bun:       { front: [[0, 'hlh.________'], [1, 'hhHa________'], [2, 'H___________']],
               back:  [[1, '____HHHH____'], [2, '___HhllhH___'], [3, '___HhhhhH___'], [4, '____HHHH____'], [5, '_____aa_____']] },
  spiky:     { front: [[0, '...h.h.h.h..'], [1, '.hhhhhhhlhhh'], [2, 'h___________'], [4, 'h___________']],
               back:  [[0, '..h.h.h.h.h.'], [1, '.hhhhhhhhhhh'], [3, 'h___________'], [5, 'h___________']] },
  bald:      { front: [[0, '....sssss...'], [1, '..Sssssssss.'], [2, '.Ssssssswsss'], [3, '.Sssssssssss'], [4, '.SsSssssssss'], [5, '.SsbSsssssss'], [6, '.SsS________'], [7, '.SSs________'], [8, '..Ss________'], [9, '...S________']],
               back:  [[0, '...ssssss...'], [1, '..sssssssss.'], [2, '.sssswssssss'], [3, '.sssssssssss'], [4, '.sssssssssss'], [5, '.sssssssssss'], [6, '.Sssssssssss'], [7, '.SssssssssSs'], [8, '..SSsssssSS.'], [9, '...SSSSSS...']] },
  bangs:     { front: [[4, '.hhhhhhhhhhh'], [5, '_____HhHhHhH']] },
  bob:       { front: [[5, '___________h'], [6, 'hHhh_______h'], [7, 'hHhh_______h'], [8, 'hhhH_______H'], [9, '.HHH________']],

const luminance = c => { const [r, g, b] = toRGB(c); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
function lookPal(L) {
  return {
    h: L.hair, H: dark(L.hair, .28), l: lite(L.hair, .35),
    // 深肤色上默认眼色几乎看不见，换成更深的一档
    s: L.skin, S: dark(L.skin, .13), b: mix(L.skin, '#ff6f6f', .35), e: luminance(L.skin) < .45 ? '#140d12' : '#2a2230',
    c: L.shirt, C: dark(L.shirt, .22), w: '#ffffff', p: L.pants || '#3a3f52',
    a: L.accColor || '#454b5e', A: L.accColor ? dark(L.accColor, .25) : '#ff8a5c',
    r: '#d8423a', g: '#9aa3b8',
    k: '#1d2130', m: '#f3f6fb', M: '#c5cdd9', y: '#ffd35c', Y: '#d9a92e',   // 墨镜片 / 口罩 / 工牌卡片
  };
}
// 走路 = 坐姿模板下面再接三行腿脚;手臂沿用打字的两帧补丁当摆臂
const LEGS = {
  stand: ['...pp..pp...', '...pp..pp...', '..kkk..kkk..'],
  walkA: ['..pp....pp..', '.pp......pp.', '.kk......kk.'],
  walkB: ['...pp..pp...', '...pp..pp...', '..kkk..kkk..'],
};
const WALK_ARMS = { walkA: 'typeA', walkB: 'typeB' };
function charSprite(L, pose, frame, flip) {
  return sprite(`ch|${L.key}|${pose}|${frame}|${+flip}`, () => {
    const legs = LEGS[frame];
    let rows = patch(BODY[pose], FRAMES[pose][legs ? WALK_ARMS[frame] : frame]);
    for (const k of L.acc) rows = patch(rows, ACC[k] && ACC[k][pose]);
    if (legs) rows = rows.concat(legs);
    const cv = pix(rows, lookPal(L), flip);
    return { cv, ax: cv.width >> 1, ay: cv.height - 2 };
  });
}

// 工位局部坐标：u = 朝向轴（人朝 +u 或 -u），v = 横向；axis 决定映射到世界 x 还是 y
const sBox = (g, o, ax, u, v, z, du, dv, h, c) => ax === 'x' ? box(g, o, u, v, z, du, dv, h, c) : box(g, o, v, u, z, dv, du, h, c);
const sLineU = (g, o, ax, v, u0, u1, z, c) => ax === 'x' ? lineY(g, o, v, u0, u1, z, c) : lineX(g, o, v, u0, u1, z, c);
const sLineV = (g, o, ax, u, v0, v1, z, c) => ax === 'x' ? lineX(g, o, u, v0, v1, z, c) : lineY(g, o, u, v0, v1, z, c);
const sFaceU = (g, o, ax, u, v0, v1, z0, z1, c) => ax === 'x' ? faceX(g, o, u, v0, v1, z0, z1, c) : faceY(g, o, u, v0, v1, z0, z1, c);

function stationSprite(S, part) {  // 同款工位（朝向+配色相同）只渲染一次
  const { axis: ax, s, desk, chair, mon } = S;
  return isoSprite(`st|${ax}|${s}|${desk}|${chair}|${mon}|${part}`, [-11, -11, 11, 11, 18], (g, o) => {
    const d0 = s > 0 ? 3 : -10, mu = s > 0 ? 7 : -8, ku = s > 0 ? 3 : -5;
    const B = (...a) => sBox(g, o, ax, ...a);
    const chairBack = () => B(s > 0 ? -3 : 2, -2, 4, 1, 4, 7, chair);
    const chairBase = () => { B(-2, -2, 0, 4, 4, 1, '#4a4e60'); B(-1, -1, 1, 2, 2, 2, '#5d6275'); B(-2, -2, 3, 4, 4, 1, chair); };
    const deskAll = () => {
      B(d0, -6, 0, 7, 1, 6, dark(desk, .1));                 // 挡板
      B(d0, 2, 0, 7, 4, 6, desk);                             // 抽屉柜
      const dl = dark(desk, .3);
      sLineU(g, o, ax, 6, d0 + 1, d0 + 6, 4, dl); sLineU(g, o, ax, 6, d0 + 1, d0 + 6, 2, dl);
      B(d0, -6, 6, 7, 12, 2, desk);                           // 桌面
    };
    const keyboard = () => B(ku, -3, 8, 2, 4, 1, '#d3d8e2');
    const monitor = () => { B(mu - 1, -3, 8, 3, 3, 1, mon); B(mu, -2, 9, 1, 1, 2, mon); B(mu, -5, 10, 1, 6, 6, mon); };
    const mug = () => B(d0 + (s > 0 ? 1 : 5), 4, 8, 1, 1, 2, '#f5f5f5');
    if (s > 0) { if (part === 'back') { chairBack(); chairBase(); } else { deskAll(); keyboard(); monitor(); mug(); } }
    else { if (part === 'back') { deskAll(); monitor(); keyboard(); mug(); chairBase(); } else chairBack(); }
  });
}

  const a=AG[id];if(!a)return;
  if(STN[a.seat]&&STN[a.seat].agent===id)STN[a.seat].agent=null;
  a.walk=null;walkers.delete(a);
  a.bub.remove();delete AG[id];
  if(selected===id)selected=null;
}
function clearAgents() {
  for(const id of Object.keys(AG))removeAgent(id);
  for(const e of envelopes)e.el?.remove();
  envelopes.length=0;floats.length=0;walkers.clear();
}
// 进出场：只在本办公室已经显示过一帧真实快照后才演（切换办公室、重连恢复都直接落座）
const motionOK=()=>liveReady&&!reducedMotion.matches;
const shortName=name=>{const s=[...String(name||'')];return s.length>8?s.slice(0,7).join('')+'…':s.join('');};
function bossOf(item,visible) {
  const parent=item.parentPath&&visible.find(x=>x.path===item.parentPath&&AG[x.id]&&!AG[x.id].leaving);
  const boss=parent||visible.find(x=>x.root);
  return boss&&AG[boss.id]&&boss.id!==item.id?AG[boss.id]:null;
}
const posOf=a=>a.walk?[a.walk.x,a.walk.y]:STN[a.seat]?[STN[a.seat].x,STN[a.seat].y]:DOOR;
// 新成员：进门 → 到派活的人桌前领信封 → 绕到自己椅子后面 → 坐下
function enterOffice(a,boss,from=DOOR) {
  const S=STN[a.seat];
  if(!S)return;
  if(!motionOK()) {   // 减少动态效果：不走路，信封直接从派活的人飞到工位
    if(boss&&liveReady){send(boss.id,a.id,'任务');say(boss.id,'派给 '+shortName(a.name),2200);}
    return;
  }
  const stops=[{p:from}];
  const B=boss&&!boss.walk&&STN[boss.seat];
  if(B) stops.push({p:deskFront(B),wait:1000,face:[B.x,B.y],call:()=>{send(boss.id,a.id,'任务');say(boss.id,'交给你了',1500);}});
  stops.push({p:seatBehind(S)},{p:[S.x,S.y],direct:true});
  startWalk(a,route(stops),null);
}
// 离开：完成的人先到上级桌前交回报，再出门；失败/停止的人直接出门
function leaveOffice(a,boss,report) {
  const S=STN[a.seat];
  if(S&&S.agent===a.id)S.agent=null;
  a.leaving=true;
  const from=posOf(a),stops=[{p:from}];
  if(S&&!a.walk)stops.push({p:seatBehind(S),direct:true});
  const B=report&&boss&&!boss.walk&&STN[boss.seat];
  if(B) stops.push({p:deskFront(B),wait:1000,face:[B.x,B.y],call:()=>{send(a.id,boss.id,'回报');say(boss.id,'收到 '+shortName(a.name)+' 的结果',2600);}});
  stops.push({p:DOOR});
  startWalk(a,route(stops),()=>removeAgent(a.id));
}
// 正在往外走的人又接到任务：掉头回工位
function returnToSeat(a,boss) {
  const seat=freeSeat(a.seat);
  if(!seat){removeAgent(a.id);return false;}
  a.leaving=false;a.seat=seat;STN[seat].agent=a.id;
  enterOffice(a,boss,posOf(a));
  if(!motionOK()){a.walk=null;walkers.delete(a);}
  return true;
}
function stableLook(seed) {
  const rand=rng(seed), choose=items=>items[Math.floor(rand()*items.length)];
  const style=choose(HAIR_STYLES);let head=choose(HEADWEAR);
  if(TALL_HAIR.has(style)&&(head==='cap'||head==='beanie'))head='';
  return {hair:choose(HAIR_COLORS),skin:choose(SKIN_TONES),shirt:choose(SHIRT_COLORS),pants:'#3a3f52',acc:[style,head,choose(FACEWEAR),choose(CHESTWEAR)].filter(Boolean),accColor:choose(ACC_COLORS)};
}
function safeIcon(svg) {
  // Keep SVG in an image document: never inject bridge-provided markup into DOM.
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(String(svg).replace(/currentColor/g,'#27324f'));
}
function applyOfficeSnapshot(next) {
  if(!next||next.version!==1||!Array.isArray(next.agents)||!Array.isArray(next.offices))return;
  const identity=next.selected?.sessionId||'';
  const changed=identity!==officeIdentity;
  if(changed) {
    clearAgents();officeIdentity=identity;liveReady=false;seenTransfers.clear();
    $('officeMembers').hidden=true;reportOfficeRegions();
    relayout(Number(next.seed)||1);
  }
  officeSnapshot=next;
  const visible=next.agents.slice(0,8), ids=new Set(visible.map(a=>a.id)), completed=new Set(next.completed||[]);
  for(const id of Object.keys(AG)) {
    const a=AG[id];
    if(ids.has(id)||a.leaving)continue;
    const item={id,parentPath:a.parentPath||''}, boss=bossOf(item,visible), report=completed.has(id);
    if(motionOK()) {a.state=report?'done':a.state;a.activityLabel=report?'已完成':a.activityLabel;a.detail='';leaveOffice(a,boss,report);}
    else {
      if(liveReady&&report&&boss){send(id,boss.id,'回报');say(boss.id,'收到 '+shortName(a.name)+' 的结果',2600);}
      removeAgent(id);
    }
  }
  for(const item of visible) {
    let a=AG[item.id];
    if(a&&a.leaving&&!returnToSeat(a,bossOf(item,visible)))a=null;
    if(!a) {
      a=addAgent({id:item.id,name:item.name,role:item.root?'conductor':'coder',seat:item.root?'s_conductor':undefined,
        look:item.root?{hair:'#3b2a22',skin:'#f7d5b5',shirt:'#2d406e',pants:'#262b38',acc:['tie']}:stableLook(item.seed)});
      if(!a)continue;
      a.parentPath=item.parentPath||'';
      if(liveReady&&!item.root)enterOffice(a,bossOf(item,visible));
    }
    const key=[item.state,item.label,item.tool].join('|');
    if(key!==a.activityKey){a.activityKey=key;a.labelAt=simNow;}
    a.name=item.name;a.contextKnown=item.contextKnown;a.contextRatio=item.contextRatio;a.parentPath=item.parentPath||'';
    a.activityLabel=item.label;a.detail=item.detail||'';a.tool=item.tool;a.icon=item.icon||'';a.iconSvg=item.iconSvg||'';
    if(liveReady&&item.compactId&&item.compactId!==a.compactId) {
      robot.text='整理好旧文件了';robot.textUntil=simNow+2600;
    }
    a.compactId=item.compactId;
    setState(a.id,item.state);
    if(item.state==='compact'){robot.text='整理上下文';robot.textUntil=simNow+1600;}
    for(const transfer of item.transfers||[]) {
      const key=item.id+':'+transfer.seq;
      if(seenTransfers.has(key))continue;
      seenTransfers.add(key);
      if(!liveReady)continue;
      const from=visible.find(x=>x.id===transfer.sender_session_id||x.path===transfer.sender);
      const to=visible.find(x=>x.path===transfer.recipient)||item;
      if(!from||!to||from.id===to.id||!AG[from.id]||!AG[to.id])continue;
      send(from.id,to.id,TRANSFER_TAG[transfer.type]||'消息');
    }
  }
  while(seenTransfers.size>256)seenTransfers.delete(seenTransfers.values().next().value);
  board.doing=next.agents.filter(a=>a.busy).length;
  board.todo=next.agents.filter(a=>a.state==='permission'||a.state==='question').length;
  board.done=next.agents.some(a=>a.root&&a.state==='sleep')?1:0;
  tokens=next.agents.reduce((n,a)=>n+(a.contextTokens||0),0);
  updateOfficeControls();syncOfficeMembers();liveReady=true;render();presentUpscale();
}
let controlsKey='';
function updateOfficeControls() {
  const s=officeSnapshot, tabs=$('officeTabs');
  const key=JSON.stringify([s.offices,s.selected?.sessionId,s.follow,s.connected,s.complete,s.overflow]);
  if(key===controlsKey)return;controlsKey=key;
  tabs.replaceChildren();
  s.offices.slice(0,5).forEach((office,index)=>{
    const b=document.createElement('button');b.type='button';b.className='office-tab';b.setAttribute('role','tab');
    b.textContent=office.title||String(index+1);b.title=[office.workspaceName,office.title].filter(Boolean).join(' / ');
    b.setAttribute('aria-label',b.title);b.setAttribute('aria-selected',String(office.sessionId===s.selected?.sessionId));
    b.addEventListener('click',()=>action({type:'select',session_id:office.sessionId,workspace_hash:office.workspaceHash}));
    tabs.appendChild(b);
  });
  $('officeFollow').setAttribute('aria-checked',String(s.follow));
  const notice=$('officeNotice');
  notice.textContent=!s.connected?'连接已中断，正在重连':!s.selected?(s.complete===false?'正在读取最近会话':'发送消息后，会话会出现在这里'):s.complete===false?'正在读取最近会话':'';
  notice.hidden=!notice.textContent;
  const overflow=$('officeOverflow');overflow.hidden=!s.overflow;overflow.textContent='+'+s.overflow;
  overflow.setAttribute('aria-label','查看其余 '+s.overflow+' 位成员');
}
$('officeFollow').addEventListener('click',()=>action({type:'follow',follow:!officeSnapshot.follow}));
function reportOfficeRegions() {
  const rects=[$('officeMembers'),$('officeNotice')].filter(node=>node&&!node.hidden).map(node=>node.getBoundingClientRect());
  const rect=rects.length?[Math.min(...rects.map(r=>r.left))/innerWidth,Math.min(...rects.map(r=>r.top))/innerHeight,
    Math.max(...rects.map(r=>r.right))/innerWidth,Math.max(...rects.map(r=>r.bottom))/innerHeight]:null;
  const bounds=officeControls.getBoundingClientRect();
  const controls=officeControls.classList.contains('is-visible')
    ? [Math.max(0,bounds.left-3)/innerWidth,Math.max(0,bounds.top-3)/innerHeight,
      Math.min(innerWidth,bounds.right+3)/innerWidth,Math.min(innerHeight,bounds.bottom+3)/innerHeight] : null;
  action({type:'overlay',rect,controls,bubbles:bubbleRegions});
}
function syncOfficeMembers() {
  const list=$('officeMembers');
  if(!officeSnapshot.overflow)list.hidden=true;
  if(list.hidden){reportOfficeRegions();return;}
  const focused=document.activeElement?.dataset.memberId;
  list.replaceChildren();
  for(const member of officeSnapshot.agents){const b=document.createElement('button');b.type='button';b.dataset.memberId=member.id;b.textContent=member.name+' · '+member.label;
    b.addEventListener('click',()=>{action({type:'open',session_id:member.id,workspace_hash:officeSnapshot.selected?.workspaceHash||''});list.hidden=true;reportOfficeRegions();});list.appendChild(b);}
  if(focused){const button=Array.from(list.children).find(b=>b.dataset.memberId===focused);(button||$('officeOverflow')).focus();}
  reportOfficeRegions();
}
$('officeOverflow').addEventListener('click',()=>{
  const list=$('officeMembers');list.hidden=!list.hidden;syncOfficeMembers();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('officeMembers').hidden=true;reportOfficeRegions();}});
cv.addEventListener('dblclick',()=>{if(selected)action({type:'open',session_id:selected,workspace_hash:officeSnapshot.selected?.workspaceHash||''});});
// A stable empty room appears until the first real snapshot; no demo workers.
buildLayout(1);
window.AgentOffice={applySnapshot:applyOfficeSnapshot,get snapshot(){return officeSnapshot;},
  get agents(){return Object.values(AG).map(a=>({id:a.id,name:a.name,state:a.state,contextRatio:a.contextRatio,look:a.look.key,seat:a.seat,
    walking:!!a.walk,leaving:a.leaving,bubble:a.bub.hidden?'':a.bub.textContent,compact:a.bub.classList.contains('compact')}));},
  get envelopes(){return envelopes.map(e=>({from:e.a.id,to:e.b.id,label:e.el?e.el.textContent:''}));},
  get layoutSignature(){return JSON.stringify({theme:THEME,seats:Object.values(STN).map(s=>[s.id,s.x,s.y,s.axis,s.s])});},
  // 测试用：按 32ms 步长推进模拟时间（走路、信封、等待）后重画一帧
  advance(ms){for(let left=ms;left>0;left-=32)advance(Math.min(32,left));render();presentUpscale();},
  layout:seed=>relayout(seed)};
fit();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});

})();

</script>

<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Animated ACECode icon</title>
  <desc id="description">
    A blue and cyan ACECode icon with a moving light source, sweeping highlights, and responsive shadows.
  </desc>

  <defs>
    <linearGradient id="background" x1="74" y1="38" x2="438" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D5F7"/>
      <stop offset="0.38" stop-color="#1687DA"/>
      <stop offset="0.7" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#082A52"/>
    </linearGradient>
    <radialGradient id="moving-light" cx="85" cy="60" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.48"/>
      <stop offset="0.46" stop-color="#A5F3FC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
      <animate
        attributeName="cx"
        values="85;175;145;70;85"
        keyTimes="0;0.28;0.58;0.82;1"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        calcMode="spline"
        dur="11.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="60;80;140;110;60"
        keyTimes="0;0.28;0.58;0.82;1"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        calcMode="spline"
        dur="11.5s"
        repeatCount="indefinite"
      />
    </radialGradient>
    <radialGradient id="moving-shadow" cx="440" cy="420" r="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617" stop-opacity="0.24"/>
      <stop offset="0.68" stop-color="#020617" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
      <animate
        attributeName="cx"
        values="440;405;420;456;440"
        keyTimes="0;0.28;0.58;0.82;1"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        calcMode="spline"
        dur="11.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="420;390;365;398;420"
        keyTimes="0;0.28;0.58;0.82;1"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        calcMode="spline"
        dur="11.5s"
        repeatCount="indefinite"
      />
    </radialGradient>
    <linearGradient id="letter" x1="92" y1="126" x2="314" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="prompt" x1="345" y1="199" x2="432" y2="313" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-8%" width="120%" height="132%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <filter id="mark-shadow" x="-16%" y="-16%" width="132%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow
        dx="7"
        dy="9"
        stdDeviation="6"
        flood-color="#031B36"
        flood-opacity="0.42"
        result="mark-drop-shadow"
      >
        <animate
          attributeName="dx"
          values="7;5;6;8;7"
          keyTimes="0;0.28;0.58;0.82;1"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
          calcMode="spline"
          dur="11.5s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="dy"
          values="9;8;7;8;9"
          keyTimes="0;0.28;0.58;0.82;1"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
          calcMode="spline"
          dur="11.5s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="flood-opacity"
          values="0.42;0.38;0.36;0.41;0.42"
          keyTimes="0;0.28;0.58;0.82;1"
          dur="11.5s"
          repeatCount="indefinite"
        />
      </feDropShadow>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="soft-alpha"/>
      <feSpecularLighting
        in="soft-alpha"
        surfaceScale="3"
        specularConstant="0.48"
        specularExponent="20"
        lighting-color="white"
        result="mark-specular"
      >
        <fePointLight x="85" y="60" z="190">
          <animate
            attributeName="x"
            values="85;175;145;70;85"
            keyTimes="0;0.28;0.58;0.82;1"
            keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
            calcMode="spline"
            dur="11.5s"
            repeatCount="indefinite"
          />
          <animate
            attributeName="y"
            values="60;80;140;110;60"
            keyTimes="0;0.28;0.58;0.82;1"
            keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
            calcMode="spline"
            dur="11.5s"
            repeatCount="indefinite"
          />
        </fePointLight>
      </feSpecularLighting>
      <feComposite in="mark-specular" in2="SourceAlpha" operator="in" result="clipped-specular"/>
      <feMerge>
        <feMergeNode in="mark-drop-shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="clipped-specular"/>
      </feMerge>
    </filter>
    <clipPath id="tile-clip">
      <rect x="20" y="20" width="472" height="472" rx="112"/>
    </clipPath>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#background)"/>
    <g clip-path="url(#tile-clip)">
      <rect x="20" y="20" width="472" height="472" fill="url(#moving-light)"/>
      <rect x="20" y="20" width="472" height="472" fill="url(#moving-shadow)"/>
      <path
        d="M20 386C126 326 223 326 310 363C378 392 438 391 492 357V492H20V386Z"
        fill="#020617"
        fill-opacity="0.12"
      />
    </g>
    <rect
      x="21.5"
      y="21.5"
      width="469"
      height="469"
      rx="110.5"
      stroke="white"
      stroke-opacity="0.24"
      stroke-width="3"
    />
  </g>

  <g filter="url(#mark-shadow)">
    <path
      fill="url(#letter)"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M73 384L164.5 139.5C169.1 127.2 178.3 121 192 121H210C223.7 121 232.9 127.2 237.5 139.5L329 384H265L245.7 326H154.3L135 384H73ZM174.7 266H225.3L200.3 190.8L174.7 266Z"
    />
    <path
      d="M348 203L431 256L348 309"
      stroke="url(#prompt)"
      stroke-width="38"
      stroke-linecap="square"
      stroke-linejoin="miter"
    />
  </g>

</svg>

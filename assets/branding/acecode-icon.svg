<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ACECode</title>
  <!-- 底色取自 Web UI 主题 token:--ace-accent(dark #3b82f6)渐变到深端,
       与 assets/branding 的概念图同一色系。 -->
  <defs>
    <linearGradient id="acebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="acesheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#acebg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#acesheen)"/>

  <!-- A(ACE / Agent) -->
  <path d="M104 384 L194 148 L284 384" fill="none" stroke="#ffffff"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="149" y1="306" x2="239" y2="306" stroke="#ffffff"
        stroke-width="38" stroke-linecap="round"/>

  <!-- 终端提示符 > (Code) -->
  <path d="M318 212 L406 292 L318 372" fill="none" stroke="#ffffff"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

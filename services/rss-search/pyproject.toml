[project]
name = "acecode-rss-search"
version = "0.1.0"
description = "Curated RSS/Atom/JSON Feed search service for AceCode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rss-search = "rss_search_service.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_search_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
